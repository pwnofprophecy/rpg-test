<svg xmlns="http://www.w3.org/2000/svg" width="32" height="48" viewBox="0 0 32 48">
  <!-- Body -->
  <rect x="4" y="16" width="24" height="28" rx="2" fill="#D95B5B"/>
  <!-- Head -->
  <rect x="8" y="2" width="16" height="16" rx="3" fill="#A8D08A"/>
  <!-- Eyes (angry) -->
  <rect x="10" y="8" width="4" height="3" rx="1" fill="#2C2C2C"/>
  <rect x="18" y="8" width="4" height="3" rx="1" fill="#2C2C2C"/>
  <!-- Angry eyebrows -->
  <line x1="9" y1="6" x2="15" y2="7" stroke="#2C2C2C" stroke-width="1.5"/>
  <line x1="23" y1="6" x2="17" y2="7" stroke="#2C2C2C" stroke-width="1.5"/>
  <!-- Mouth (frown) -->
  <path d="M12 15 Q16 13 20 15" stroke="#2C2C2C" stroke-width="1.5" fill="none"/>
  <!-- Belt -->
  <rect x="4" y="30" width="24" height="4" rx="1" fill="#A03A3A"/>
  <!-- Legs -->
  <rect x="5" y="44" width="9" height="4" rx="1" fill="#A03A3A"/>
  <rect x="18" y="44" width="9" height="4" rx="1" fill="#A03A3A"/>
</svg>
